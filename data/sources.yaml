# Source registry — every source considered, including rejected ones.
# A source is validated PER SEGMENT: Google Maps can pass for clinics and fail
# for D2C brands. Metrics are written by scripts/03_source_report.py into
# data/samples/<source>__<segment>__report.md; status changes here are manual,
# with a reason and a date.
#
# role:   primary | enrichment | exclusion_list | competitor_signal
# status: pending_validation | accepted | rejected | not_attempted
# rejection_reason: low_sme_coverage | wrong_population | deprecated |
#                   access_cost | tos_risk | stale | by_design

validation_protocol:
  set_on: 2026-09-16
  set_before_data: true          # thresholds chosen before seeing any sample
  sample_size: 20
  random_seed: 42
  thresholds:
    icp_relevance_min: 0.60      # fit / labeled, unclear counts as not fit
    contactable_min: 0.50        # mobile | instagram | whatsapp link

sources:
  # ---------- primary, to validate on Day 1 ----------
  - id: google_maps
    role: primary
    tool: Apify compass/crawler-google-places
    segments: [A_aesthetic_clinics, B_custom_furniture]
    status: accepted
    decided_on: 2026-09-17
    validation:
      runs: "2026-09-17__full_*"   # probes excluded: their location leaked into Riyadh Province
      reports: [data/samples/google_maps__A_aesthetic_clinics__report.md, data/samples/google_maps__B_custom_furniture__report.md]
      A_aesthetic_clinics:
        verdict: accept
        n_records: 360
        icp_relevance: 0.80          # 16 fit / 20; Jeddah 0.70, Riyadh 0.90
        contactable_rate: 0.789      # mobile 0.503, instagram 0.528 (from scrapeContacts)
      B_custom_furniture:
        verdict: accept_with_limitation
        n_records: 418
        icp_relevance: 0.65          # 13 fit / 20; Jeddah 0.40, Riyadh 0.90
        contactable_rate: 0.880      # almost all via mobile
        limitation: >
          Jeddah below threshold on a 10-record sample (keywords chosen on Riyadh return furniture
          showrooms there). Thresholds were set per source x segment, not per city, so the verdict
          stands; mitigation is a Day 2 rule keeping only records with a custom-work signal in name or
          category (110/208 Jeddah, 194/210 Riyadh). Rule was fitted on the same sample; re-checked
          2026-09-17 on 50 probe records labelled before the rule existed: all 45 fit kept, 4 of 5 not_fit dropped
          (data/samples/rules_check.md). That probe was 95% Riyadh, so Jeddah remains untested.

  - id: instagram
    role: enrichment
    tool: Apify apify/instagram-profile-scraper
    segments: [A_aesthetic_clinics, B_custom_furniture, C_salla_zid_d2c]
    status: not_attempted
    decided_on: 2026-09-17
    note: >
      Handles already come from Google Maps scrapeContacts (A: 52.8% of records). Profile scraping
      postponed to Day 2 for A-tier leads only (BNPL mentions in bio/captions), budget permitting.
      Closed 2026-09-17 without running: the Apify budget ended at $4.64 of $5 and BNPL presence was read from
      merchant websites instead. Instagram handles are still used as a contact channel in scoring.

  - id: salla_zid_dork
    role: primary
    tool: Google search operators -> url_list CSV (links collected from the results page in the browser)
    segments: [C_salla_zid_d2c]
    status: rejected
    rejection_reason: segment_rejected_bnpl_saturation   # the source itself passed relevance (0.65) and contactability (1.00)
    decided_on: 2026-09-17
    validation:
      runs: "2026-09-17__dork"
      report: data/samples/salla_zid_dork__C_salla_zid_d2c__report.md
      C_salla_zid_d2c:
        queries_run: 5                 # of 10 allowed by the kill criterion
        unique_stores: 43              # kill criterion: < 30 from 10 queries -> passed with 5
        store_url_pattern: confirmed   # salla.sa/<store>/..., <store>.zid.store/...; 43/43 parsed
        icp_relevance: 0.65            # 13 fit / 20 (2 not_fit: reseller or wholesale; 5 unclear from title alone)
        contactable_rate: 1.00         # 20/20 on the validation sample, 2026-09-17: 8 Zid by script, 12 Salla by hand
                                       # (data/samples/C_contact_check.csv); the dork report's 0.0 was missing data
        bnpl_provider_share: 0.70      # 14/20 sampled stores show a provider (Tabby 11, other 3): Salla 11/12, Zid 3/8
        verdict: reject                # icp.yaml kill criterion "> 0.60 of stores already show a BNPL provider" hit
        condition: >
          Measure contactability on Day 2 from the store pages (the same fetch as the BNPL fingerprint).
          If contactable_rate < 0.50 the source is rejected.
          Amended 2026-09-17 (step 4.1, before measuring): Salla pages return a Cloudflare bot challenge to scripts and
          it is not bypassed, so contactability is measured on the 20-store validation sample: Zid stores by script,
          Salla stores by hand in a browser, same definition (phone, wa.me or tel link, or Instagram on the homepage).
        caveats: >
          Labels come from search-result titles only. 2 of 43 stores show a non-KSA signal in the name
          (Bahrain, Emirates); country is checked on Day 2. Resellers of global perfume brands are labelled
          not_fit because the hypothesis is D2C brands, although they are valid BNPL merchants.

  # ---------- roles other than primary ----------
  - id: openai_llm_enrichment
    role: enrichment
    tool: scripts/06_enrich.py, model gpt-5.6-luna (structured outputs, strict JSON schema), config/llm.yaml
    status: accepted_with_limitation
    decided_on: 2026-09-17
    report: data/samples/enrich_summary.md
    note: >
      519 candidates (eligible A and B minus 20 Tabby merchants), 0 errors, $0.24. Input: name, Maps categories, city and
      homepage text from the step 4.2 cache (phones masked). Verified owner names 48 (42 from the business name), prices on
      the page 12, page-grounded Arabic openers 133. Limitation: SME homepages rarely name the owner, and the model's
      category ticket ranges are not a measurement, so Ticket fit uses the icp.yaml segment range.

  - id: merchant_websites
    role: enrichment
    tool: scripts/05_web_fingerprint.py (httpx, homepage only, honest User-Agent, bot challenges not bypassed)
    status: accepted
    decided_on: 2026-09-17
    report: data/samples/bnpl_summary.md
    note: >
      BNPL provider and contact flags for eligible merchants with an own site or store (A 164, B 84, C 40).
      Page loaded: A 109, B 46, Zid 16 of 16, Salla 0 of 24 (Cloudflare challenge). Most failures are bot protection
      (HTTP 403); the rest are sites broken for any visitor (DNS, TLS, 404, 5xx). BNPL status stays unknown for
      merchants without a site (A 86, B 205) and for pages that did not load.
      QA 2026-09-17: all 20 Tabby detections in A and B confirmed (eye check 9 of 20, page source 20 of 20;
      data/samples/bnpl_tabby_qa.md).

  - id: tabby_merchant_directory
    role: exclusion_list
    status: accepted
    decided_on: 2026-09-17
    method: per-lead lookup, not a bulk list
    note: >
      Public store directory and per-merchant pages exist (tabby.ai/en-SA/shop/stores, tabby.ai/en-SA/merchant/<slug>);
      no free bulk export. NOT queried per lead in this project: the 20 exclusions "already Tabby merchant" come from
      markers on the merchant's own site plus the QA of every detection (data/samples/bnpl_tabby_qa.md). A per-lead
      directory lookup before first contact stays on the to-do list (notebooks/state.md).
      Context only: StoreLeads reports 2,377 KSA e-commerce stores with Tabby (paid list, July 2026).

  - id: tamara_merchant_directory
    role: competitor_signal
    status: accepted
    decided_on: 2026-09-17
    method: per-lead lookup, not a bulk list
    note: >
      Store pages at tamara.co/en-sa/stores/<slug>; no free bulk export. NOT queried per lead either: the
      competitor_only status comes from Tamara markers on the merchant's own site (switch / dual-BNPL pitch).
      Context only: StoreLeads reports 4,940 KSA e-commerce stores with Tamara.

  - id: apollo
    role: enrichment
    status: not_attempted
    note: >
      Day 2 email waterfall for segment C founders with a LinkedIn footprint only.
      Closed 2026-09-17 without running: segment C was rejected, so the population it targeted no longer exists.

  # ---------- rejected before collection ----------
  - id: linkedin_sales_navigator
    role: primary
    status: rejected
    rejection_reason: low_sme_coverage
    note: >
      KSA SME owners in target verticals sell through WhatsApp/Instagram/Snapchat;
      LinkedIn scraping also carries ToS risk. Not scraped in this project.

  - id: crunchbase_magnitt
    role: primary
    status: rejected
    rejection_reason: wrong_population
    note: VC-backed startups, not SME merchants.

  - id: maroof
    role: primary
    status: rejected
    rejection_reason: deprecated
    note: Ministry of Commerce moved e-store registration to business.sa (Mar 2023).

  - id: wathq_cr_api
    role: enrichment
    status: rejected
    rejection_reason: access_cost
    note: Paid, slow access; disproportionate for a 3-day artifact.

  - id: snapchat
    role: primary
    status: rejected
    rejection_reason: tos_risk
    note: High KSA relevance as an outreach channel, not as a scraped source.
