[project]
name = "ksa-sme-pipeline"
version = "0.1.0"
description = "SME merchant sourcing, validation and scoring pipeline for KSA (BNPL outbound)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pre-commit>=4.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
