# Data contract for one canonical record (one row = one record from one source).
# A merchant can appear as several records (Maps + Instagram + store); Day 2
# entity resolution links them via shared identifiers into merchant_id.
#
# Why not domain as the primary key (as in the Higgsfield project):
# most target SMEs here have no own website — a clinic or majlis workshop is a
# Maps listing + Instagram + a WhatsApp number. Identity = any of
# phone_e164 | website_domain | instagram_handle | store_key | google_place_id.
#
# stage:  ingest (Day 1) | resolve / enrich / score (Day 2)
# pii:    true -> never committed unmasked (data/private or masked in samples)
# origin: llm -> column name MUST end with _inferred (enforced by tests)

columns:
  # --- lineage ---
  - {name: record_id,         stage: ingest, type: str,   pii: false, desc: "source_id:native_id"}
  - {name: source_id,         stage: ingest, type: str,   pii: false, desc: "id in data/sources.yaml"}
  - {name: run_id,            stage: ingest, type: str,   pii: false, desc: "raw file stem; row in data/runs.csv"}
  - {name: segment,           stage: ingest, type: str,   pii: false, desc: "segment key from config/icp.yaml"}
  - {name: query,             stage: ingest, type: str,   pii: false, desc: "search string that produced the record"}
  - {name: evidence_url,      stage: ingest, type: str,   pii: false, desc: "no evidence_url, no row"}
  # --- business ---
  - {name: name,              stage: ingest, type: str,   pii: false}
  - {name: name_key,          stage: ingest, type: str,   pii: false, desc: "Arabic/Latin-normalised name for chain + dedupe"}
  - {name: name_location_count, stage: ingest, type: int, pii: false, desc: "records sharing name_key within the run"}
  - {name: category_raw,      stage: ingest, type: str,   pii: false}
  - {name: city,              stage: ingest, type: str,   pii: false}
  - {name: address,           stage: ingest, type: str,   pii: false}
  - {name: lat,               stage: ingest, type: float, pii: false}
  - {name: lng,               stage: ingest, type: float, pii: false}
  - {name: rating,            stage: ingest, type: float, pii: false}
  - {name: reviews_count,     stage: ingest, type: int,   pii: false}
  - {name: followers_count,   stage: ingest, type: int,   pii: false}
  - {name: is_closed,         stage: ingest, type: bool,  pii: false}
  # --- identifiers / contact ---
  - {name: google_place_id,   stage: ingest, type: str,   pii: false}
  - {name: phone_e164,        stage: ingest, type: str,   pii: true,  desc: "a sole-trader mobile is personal data"}
  - {name: phone_type,        stage: ingest, type: str,   pii: false, desc: "mobile|landline|unified|tollfree|foreign|invalid|none"}
  - {name: website_domain,    stage: ingest, type: str,   pii: false}
  - {name: website_platform,  stage: ingest, type: str,   pii: false, desc: "own_site|salla|zid|instagram|whatsapp|linktree|social|none"}
  - {name: store_key,         stage: ingest, type: str,   pii: false}
  - {name: instagram_handle,  stage: ingest, type: str,   pii: false}
  - {name: has_whatsapp_link, stage: ingest, type: bool,  pii: false}
  - {name: text_blob,         stage: ingest, type: str,   pii: true,  desc: "bio + captions, input for Day 2 BNPL/LLM; may contain names"}
  # --- Day 2 (contract declared now, filled later) ---
  # LLM fields are filled per merchant in enrich_columns below (step 4.3); the record-level *_inferred columns here stay unused.
  - {name: merchant_id,       stage: resolve, type: str,  pii: false}
  - {name: exclusion_reason,  stage: resolve, type: str,  pii: false}
  - {name: bnpl_status,       stage: enrich, type: str,   pii: false, origin: rule, desc: "tabby|competitor_only|generic_installment|not_detected|fetch_failed (homepage only; not_detected is not none)"}
  - {name: bnpl_providers,    stage: enrich, type: str,   pii: false, origin: rule}
  - {name: owner_name_inferred, stage: enrich, type: str, pii: true,  origin: llm}
  - {name: ticket_sar_inferred, stage: enrich, type: str, pii: false, origin: llm}
  - {name: hook_ar_inferred,  stage: enrich, type: str,   pii: false, origin: llm}
  - {name: score,             stage: score,  type: int,   pii: false}
  - {name: tier,              stage: score,  type: str,   pii: false, desc: "A|B|C"}

# One row = one merchant (data/interim/merchants.csv, stage 4). Built from records above by scripts/04_resolve.py.
merchant_columns:
  - {name: merchant_id,      type: str,  pii: false, desc: "m_ + hash of the smallest record_id in the group"}
  - {name: segment,          type: str,  pii: false}
  - {name: cities,           type: str,  pii: false, desc: "riyadh|jeddah; empty for store-only merchants"}
  - {name: name,             type: str,  pii: false, desc: "name of the member record with most reviews"}
  - {name: n_records,        type: int,  pii: false}
  - {name: n_locations,      type: int,  pii: false, desc: "distinct Google places"}
  - {name: sources,          type: str,  pii: false}
  - {name: categories,       type: str,  pii: false}
  - {name: phone_e164,       type: str,  pii: true,  desc: "mobile preferred"}
  - {name: phone_type,       type: str,  pii: false}
  - {name: website_domain,   type: str,  pii: false}
  - {name: instagram_handle, type: str,  pii: false}
  - {name: store_key,        type: str,  pii: false}
  - {name: evidence_url,     type: str,  pii: false}
  - {name: rating,           type: float, pii: false}
  - {name: reviews_count,    type: int,  pii: false, desc: "sum over member records"}
  - {name: contactable,      type: bool, pii: false, desc: "mobile, Instagram or WhatsApp link"}
  - {name: exclusion_reason, type: str,  pii: false, desc: "all matching rules joined by '; '; empty = eligible"}
  - {name: record_ids,       type: str,  pii: false}

# One row = one eligible merchant (data/interim/bnpl.csv, stage 5, step 4.2). Built by scripts/05_web_fingerprint.py --run.
# No phone values: contacts found on the page are yes/no flags. Empty bnpl_status = no site or store, not checked.
web_columns:
  - {name: merchant_id,      type: str,  pii: false}
  - {name: segment,          type: str,  pii: false}
  - {name: platform,         type: str,  pii: false, desc: "own_site|salla|zid|no_site"}
  - {name: target_url,       type: str,  pii: false, desc: "first URL tried; own site also tried with www."}
  - {name: final_url,        type: str,  pii: false}
  - {name: http_status,      type: int,  pii: false, desc: "0 = connection error"}
  - {name: fetch_error,      type: str,  pii: false}
  - {name: bnpl_status,      type: str,  pii: false, origin: rule, desc: "tabby|competitor_only|generic_installment|not_detected|fetch_failed; empty = not checked"}
  - {name: bnpl_providers,   type: str,  pii: false, origin: rule, desc: "providers joined by |"}
  - {name: evidence_kinds,   type: str,  pii: false, desc: "html|icon|text_ar|text_en behind the providers"}
  - {name: bnpl_evidence,    type: str,  pii: false, desc: "provider:kind:marker joined by ' ; '"}
  - {name: template_dropped, type: str,  pii: false, desc: "evidence ignored as a platform template"}
  - {name: page_phone,       type: bool, pii: false, desc: "KSA phone (text with prefix, or tel: link)"}
  - {name: page_mobile,      type: bool, pii: false}
  - {name: page_whatsapp,    type: bool, pii: false}
  - {name: page_instagram,   type: bool, pii: false}
  - {name: currency_sar,     type: bool, pii: false, desc: "SAR / ر.س in page text"}
  - {name: currency_foreign, type: bool, pii: false, desc: "AED, BHD, KWD, QAR, OMR in page text"}
  - {name: fetched_on,       type: str,  pii: false}

# One row = one enriched merchant (data/interim/enrich.csv, step 4.3). Built by scripts/06_enrich.py.
# origin llm -> name ends with _inferred (tests). Owner names and evidence are personal data: interim only.
enrich_columns:
  - {name: merchant_id,             type: str,  pii: false}
  - {name: segment,                 type: str,  pii: false}
  - {name: input_kind,              type: str,  pii: false, desc: "page_text|name_only"}
  - {name: input_chars,             type: int,  pii: false, desc: "homepage characters sent (after phone masking and cut)"}
  - {name: owner_name_inferred,     type: str,  pii: true,  origin: llm}
  - {name: owner_role_inferred,     type: str,  pii: false, origin: llm, desc: "owner|founder|medical_director|doctor_or_person_in_business_name|manager|unknown"}
  - {name: owner_evidence_inferred, type: str,  pii: true,  origin: llm, desc: "phrase from the input that contains the name"}
  - {name: ticket_sar_min_inferred, type: int,  pii: false, origin: llm}
  - {name: ticket_sar_max_inferred, type: int,  pii: false, origin: llm}
  - {name: ticket_basis_inferred,   type: str,  pii: false, origin: llm, desc: "prices_on_page|category_typical|unknown"}
  - {name: hook_ar_inferred,        type: str,  pii: false, origin: llm, desc: "AI-drafted Arabic opener, not native-reviewed"}
  - {name: hook_fact_inferred,      type: str,  pii: false, origin: llm}
  - {name: owner_name_in_source,    type: bool, pii: false, origin: rule, desc: "name found verbatim (Arabic-normalised) in the input"}
  - {name: model,                   type: str,  pii: false}
  - {name: prompt_version,          type: str,  pii: false}
  - {name: input_tokens,            type: int,  pii: false}
  - {name: output_tokens,           type: int,  pii: false}
  - {name: cost_usd,                type: float, pii: false}
  - {name: cached,                  type: bool, pii: false}
  - {name: error,                   type: str,  pii: false}
  - {name: enriched_on,             type: str,  pii: false}

# One row = one merchant from merchants.csv (data/interim/scored.csv, phase 5). Built by scripts/07_score.py.
# Excluded merchants keep their row with score_exclusion and empty points. No phone numbers and no owner names.
scored_columns:
  - {name: merchant_id,          type: str,   pii: false}
  - {name: segment,              type: str,   pii: false}
  - {name: cities,               type: str,   pii: false}
  - {name: name,                 type: str,   pii: false, desc: "business name"}
  - {name: score_exclusion,      type: str,   pii: false, desc: "stage 4 exclusion_reason | segment rejected | already Tabby merchant; empty = scored"}
  - {name: ticket_points,        type: int,   pii: false}
  - {name: bnpl_status_final,    type: str,   pii: false, desc: "bnpl.csv status after QA; unchecked = no site or page not loaded"}
  - {name: bnpl_points,          type: int,   pii: false}
  - {name: reviews_count,        type: int,   pii: false}
  - {name: reviews_quartile,     type: int,   pii: false, desc: "1 bottom .. 4 top, within segment"}
  - {name: rating,               type: float, pii: false}
  - {name: n_locations,          type: int,   pii: false}
  - {name: traction_points,      type: int,   pii: false}
  - {name: channel,              type: str,   pii: false, desc: "mobile_or_whatsapp_and_name|mobile_or_whatsapp|instagram|other_phone|none"}
  - {name: reachability_points,  type: int,   pii: false}
  - {name: score,                type: float, pii: false}
  - {name: tier,                 type: str,   pii: false, desc: "A|B|C"}
  - {name: direct_channel,       type: bool,  pii: false}
  - {name: owner_name_verified,  type: bool,  pii: false}
  - {name: hook_from_page,       type: bool,  pii: false}
  - {name: flags,                type: str,   pii: false}
  - {name: top_rank,             type: int,   pii: false, desc: "1..50 inside Top-50, empty otherwise"}
