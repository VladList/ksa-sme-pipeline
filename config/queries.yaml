# Search configuration for the full collection run. Consumed by scripts/01_build_apify_inputs.py
# and by src/ksa_pipeline/ingest.py (keyword -> segment mapping).
#
# Keyword choice is evidence-based: see data/keyword_check.csv (fit, overlap, decision, reason)
# and the two probe runs in data/runs.csv. Dropped keywords stay listed so older raw files
# still map to their segment on re-ingest.

cities:   # circles, not place names: locationQuery "Riyadh, Saudi Arabia" leaked into the whole province (2026-09-16)
  riyadh: {lng: 46.6753, lat: 24.7136, radius_km: 25}   # validated: 80/80 places in Riyadh (probe 2026-09-17)
  jeddah: {lng: 39.1728, lat: 21.5433, radius_km: 25}   # not probed; checked per city in the post-run validation report

google_maps:
  actor: compass/crawler-google-places
  pricing_checked: 2026-09-16
  price_per_1k_places_usd: 4.00      # Free plan, base price per scraped place
  contacts_per_1k_usd: 2.00          # scrapeContacts add-on
  budget_usd: 5.00                   # Apify free monthly credit. Decision 2026-09-16: no paid plan
  spent_usd: 4.64                    # probes + full run, confirmed on Apify run pages 2026-09-17
  sample:
    city: riyadh
    max_places: 20
  full:
    cities: [riyadh, jeddah]
    segments:
      A_aesthetic_clinics:
        max_places: 60               # per keyword per city; in-run dedupe fills from deeper results
        scrapeContacts: true         # experiment 2026-09-17: contactable 51% -> 72%, +38 Instagram handles on 80 clinics
      B_custom_furniture:
        max_places: 70
        scrapeContacts: false        # workshops rarely have an own website; little to enrich
  actor_defaults:
    language: en
    skipClosedPlaces: false          # a filter costs +$1/1K; closed places are excluded on Day 2 instead
    scrapePlaceDetailPage: false     # add-on +$2/1K
    scrapeContacts: false            # overridden per segment above
    scrapeSocialMediaProfiles:       # add-on +$100/1K — must stay off explicitly
      facebooks: false
      instagrams: false
      youtubes: false
      tiktoks: false
      twitters: false
    scrapeReviewsPersonalData: false # never collect reviewer personal data
    maximumLeadsEnrichmentRecords: 0 # add-on +$100/1K
    maxReviews: 0
    maxImages: 0
  segments:
    A_aesthetic_clinics:
      keywords: ["cosmetic dentist", "عيادة جلدية وتجميل", "مركز ليزر"]
      dropped: ["dermatology clinic", "عيادة تجميل أسنان", "عيادة تقويم أسنان", "orthodontic clinic", "ابتسامة هوليود"]
    B_custom_furniture:
      keywords: ["تفصيل كنب", "تفصيل مجالس", "محل ستائر"]
      dropped: ["مفروشات تفصيل", "curtains shop", "custom majlis furniture"]

dork:                        # segment C: run manually in Google, paste results into a url_list CSV
  # Segment C rejected 2026-09-17 (step 4.2, BNPL on 14/20 sampled stores): queries kept as the record of what was run.
  note: Verify the store URL pattern on the first 10 results before scaling.
  segments:
    C_salla_zid_d2c:
      - 'site:salla.sa عطور'
      - 'site:salla.sa عود'
      - 'site:salla.sa عبايات'
      - 'site:zid.store عطور'
      - 'site:zid.store عبايات'
